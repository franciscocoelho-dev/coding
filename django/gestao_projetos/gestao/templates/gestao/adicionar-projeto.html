{% extends "base.html" %}


{% block conteudo %}
    <form action="{% url "adicionar-projeto" %}" method="POST" >
        {% csrf_token %}

        {% for item in form %}
            <div class="form-group">
                {{item.label}}
                {{item}}
                <span style="color: red">
                    {{item.errors}}
                </span>
                
            </div>
        {% endfor %}

        <button style="margin-top: 2rem" class="btn btn-primary" type="submit"> Cadastrar Projeto </button>
    </form>
{% endblock conteudo %}
